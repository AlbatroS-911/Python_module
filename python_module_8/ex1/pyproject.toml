[project]
name = "loading"
version = "0.1.0"
description = "Loading data analysis"
authors = [
    {name = "tokrabem"}
]
requires-python = ">=3.11"
package-mode = false
dependencies = [
    "pandas (==3.0.5)",
    "numpy (==2.4.6)",
    "matplotlib (==3.11.1)",
    "requests (==2.34.2)",
    "python-dotenv (==1.2.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
